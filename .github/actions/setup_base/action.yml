name: "Setup base"
description: "Install Hyprland build dependencies on Arch. Hypr libraries are pinned to the revisions in flake.lock."

inputs:
  INSTALL_XORG_PKGS:
    description: "Install xorg dependencies"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Get required pacman pkgs
      shell: bash
      run: |
        sed -i 's/SigLevel    = Required DatabaseOptional/SigLevel    = Optional TrustAll/' /etc/pacman.conf
        pacman --noconfirm --noprogressbar -Syyu
        pacman --noconfirm --noprogressbar -Sy \
          base-devel \
          cairo \
          clang \
          cmake \
          git \
          glaze \
          glm \
          glslang \
          gtest \
          hyprland-protocols \
          jq \
          libcanberra \
          libdisplay-info \
          libdrm \
          libei \
          libepoxy \
          libglvnd \
          libheif \
          libinput \
          libjxl \
          libliftoff \
          librsvg \
          libspng \
          libwebp \
          libxcursor \
          libxkbcommon \
          libzip \
          lua \
          muparser \
          ninja \
          pango \
          pixman \
          pkgconf \
          pugixml \
          re2 \
          seatd \
          systemd \
          tomlplusplus \
          wayland \
          wayland-protocols \
          xcb-util \
          xcb-util-errors \
          xcb-util-image \
          xcb-util-renderutil \
          xcb-util-wm

    - name: Get Xorg pacman pkgs
      if: inputs.INSTALL_XORG_PKGS == 'true'
      shell: bash
      run: |
        pacman --noconfirm --noprogressbar -Sy \
          xorg-server-common \
          xorg-setxkbmap \
          xorg-xkbcomp \
          xorg-xwayland

    # Upstream builds these from their latest main. This fork is pinned to an upstream
    # release, so build exactly the revisions flake.lock records for it instead.
    - name: Build pinned Hypr libraries
      shell: bash
      run: |
        set -euo pipefail
        LOCK="$GITHUB_WORKSPACE/flake.lock"
        mkdir -p /tmp/hypr-deps
        cd /tmp/hypr-deps

        build() {
          local name="$1" target="${2:-all}"
          local rev
          rev="$(jq -er ".nodes[\"$name\"].locked.rev" "$LOCK")"
          echo "::group::$name @ $rev"
          git clone --recursive "https://github.com/hyprwm/$name" "$name"
          git -C "$name" checkout --recurse-submodules "$rev"
          cmake --no-warn-unused-cli -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_INSTALL_PREFIX:PATH=/usr -S "$name" -B "$name/build"
          cmake --build "$name/build" --config Release --target "$target" -j"$(nproc)"
          cmake --install "$name/build"
          echo "::endgroup::"
        }

        # order matters: later libraries depend on earlier ones
        build hyprwayland-scanner
        build hyprutils hyprutils
        build hyprlang hyprlang
        build hyprcursor
        build hyprwire
        build hyprgraphics hyprgraphics
        build aquamarine aquamarine
