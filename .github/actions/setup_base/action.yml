name: "Setup base"
description: "Install Hyprland build dependencies on Arch. Hypr libraries are pinned to the revisions in flake.lock."

inputs:
  INSTALL_XORG_PKGS:
    description: "Install xorg dependencies"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        "$GITHUB_WORKSPACE/.github/scripts/setup-deps.sh" ${{ inputs.INSTALL_XORG_PKGS == 'true' && '--xorg' || '' }}
